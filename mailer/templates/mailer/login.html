!DOCTYPE html>
<html>
<head><title>Вход</title></head>
<body>
    <h2>Вход в систему</h2>
    {% if form.errors %}
        <p style="color: red;">Неверное имя пользователя или пароль.</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <label>Имя пользователя:</label>
        {{ form.username }}<br><br>
        <label>Пароль:</label>
        {{ form.password }}<br><br>
        <button type="submit">Войти</button>
    </form>
    <p><a href="{% url 'register' %}">Нет аккаунта? Зарегистрироваться</a></p>
</body>
</html>
